name: publish-npm

# Publishes to the npm registry when a GitHub release is published.
# It stays off until you turn it on: add a repository secret NPM_TOKEN (an npm automation token)
# and a repository variable PUBLISH_NPM set to true.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    # Only this job may mint the OIDC token npm provenance needs.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
