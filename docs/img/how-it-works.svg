<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <title>How no-api-media-mcp works</title>
  <defs>
    <linearGradient id="mcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1000" height="330" rx="18" fill="#0b1020"/>

  <!-- 1. You -->
  <rect x="24" y="96" width="150" height="138" rx="14" fill="#141a33" stroke="#334155"/>
  <text x="99" y="132" text-anchor="middle" fill="#94a3b8" font-size="13">1. You say</text>
  <text x="99" y="166" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">"Make a hero</text>
  <text x="99" y="186" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">for this site"</text>
  <text x="99" y="214" text-anchor="middle" fill="#64748b" font-size="12">no prompt writing</text>

  <!-- 2. Agent -->
  <rect x="214" y="96" width="160" height="138" rx="14" fill="#141a33" stroke="#334155"/>
  <text x="294" y="132" text-anchor="middle" fill="#94a3b8" font-size="13">2. Your AI agent</text>
  <text x="294" y="166" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">Claude Code</text>
  <text x="294" y="186" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">Cursor · Codex</text>
  <text x="294" y="214" text-anchor="middle" fill="#64748b" font-size="12">any MCP client</text>

  <!-- 3. MCP -->
  <rect x="414" y="40" width="236" height="250" rx="16" fill="url(#mcp)" opacity="0.18"/>
  <rect x="414" y="40" width="236" height="250" rx="16" fill="none" stroke="url(#mcp)" stroke-width="2"/>
  <text x="532" y="72" text-anchor="middle" fill="#e2e8f0" font-size="13">3. no-api-media MCP</text>
  <g font-size="14" fill="#f8fafc">
    <text x="440" y="106">① reads your project's style</text>
    <text x="440" y="136">② writes the art direction</text>
    <text x="440" y="166">③ generates with your plan</text>
    <text x="440" y="196">④ checks every result</text>
    <text x="440" y="226">⑤ shrinks it for the web</text>
  </g>
  <text x="532" y="266" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="600">no API keys · no password seen</text>

  <!-- 4. Accounts -->
  <rect x="690" y="40" width="130" height="250" rx="14" fill="#141a33" stroke="#334155"/>
  <text x="755" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">4. Your plans</text>
  <g font-size="14" fill="#f8fafc" text-anchor="middle">
    <text x="755" y="112">Google Flow</text>
    <text x="755" y="146">ChatGPT</text>
    <text x="755" y="180">Higgsfield</text>
    <text x="755" y="214">Grok</text>
  </g>
  <text x="755" y="266" text-anchor="middle" fill="#64748b" font-size="12">signed in once</text>

  <!-- 5. Project -->
  <rect x="860" y="96" width="116" height="138" rx="14" fill="#141a33" stroke="#334155"/>
  <text x="918" y="132" text-anchor="middle" fill="#94a3b8" font-size="13">5. Your project</text>
  <text x="918" y="166" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">public/</text>
  <text x="918" y="186" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">hero.webp</text>
  <text x="918" y="214" text-anchor="middle" fill="#64748b" font-size="12">ready to ship</text>

  <g stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M176 165 H210"/>
    <path d="M376 165 H410"/>
    <path d="M652 150 H686"/>
    <path d="M822 165 H856"/>
  </g>
</svg>
